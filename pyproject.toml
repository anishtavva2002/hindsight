[project]
name = "hindsight"
version = "0.1.0"
description = "Rank risky microservices by git history and resilience gaps, then chaos-drill and score them."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["chaos-engineering", "resilience", "microservices", "git", "fault-injection"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/anishtavva2002/hindsight"
Issues = "https://github.com/anishtavva2002/hindsight/issues"

[project.scripts]
hindsight = "hindsight.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hindsight*"]

[tool.setuptools.package-data]
hindsight = ["static/*.html"]
